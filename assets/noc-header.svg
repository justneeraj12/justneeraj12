<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">NOC — Neeraj Kanchani</title>
  <desc id="desc">Animated command-center banner for robotics software, Linux systems, and AI inference.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090b"/>
      <stop offset="0.55" stop-color="#101216"/>
      <stop offset="1" stop-color="#090a0c"/>
    </linearGradient>
    <linearGradient id="redline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff334f" stop-opacity="0"/>
      <stop offset="0.48" stop-color="#ff334f"/>
      <stop offset="1" stop-color="#ff334f" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .scan { animation: scan 5.5s linear infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
    .cursor { animation: blink 1s steps(2, end) infinite; }
    .trace { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 4.5s ease-in-out infinite; }
    .signal { animation: signal 3s ease-in-out infinite; }
    @keyframes scan { from { transform: translateX(-700px); } to { transform: translateX(1800px); } }
    @keyframes pulse { 0%,100% { opacity:.35; transform:scale(.88); } 50% { opacity:1; transform:scale(1.08); } }
    @keyframes blink { 0%,45% { opacity:1; } 46%,100% { opacity:0; } }
    @keyframes draw { 0% { stroke-dashoffset:1; opacity:.2; } 45%,75% { stroke-dashoffset:0; opacity:1; } 100% { stroke-dashoffset:-1; opacity:.2; } }
    @keyframes signal { 0%,100% { opacity:.2; } 50% { opacity:.9; } }
    @media (prefers-reduced-motion: reduce) {
      .scan,.pulse,.cursor,.trace,.signal { animation:none; }
    }
  </style>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#353941"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect class="scan" x="0" y="0" width="420" height="320" fill="url(#redline)" opacity="0.08"/>

  <g transform="translate(74 58)">
    <circle cx="74" cy="102" r="67" fill="none" stroke="#343840" stroke-width="1"/>
    <circle cx="74" cy="102" r="49" fill="none" stroke="#ff334f" stroke-opacity="0.45" stroke-width="1"/>
    <circle class="pulse" cx="74" cy="102" r="7" fill="#ff334f" filter="url(#glow)"/>
    <path d="M74 25V179M-3 102H151" stroke="#535863" stroke-opacity="0.6"/>
    <path d="M27 62L52 78L68 68L85 114L102 96L122 132" fill="none" stroke="#ff334f" stroke-width="2" pathLength="1" class="trace"/>
    <text x="74" y="205" text-anchor="middle" fill="#777e8a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="3">SIGNAL LOCKED</text>
  </g>

  <g transform="translate(270 65)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="0" y="0" fill="#ff334f" font-size="13" font-weight="700" letter-spacing="4">NOC // OPERATOR_01</text>
    <text x="0" y="70" fill="#f1f3f5" font-size="52" font-weight="700" letter-spacing="2">NEERAJ KANCHANI</text>
    <text x="2" y="110" fill="#979da8" font-size="17" letter-spacing="2">ROBOTICS SOFTWARE · LINUX SYSTEMS · AI INFERENCE</text>

    <g transform="translate(2 154)" font-size="13">
      <circle class="pulse" cx="5" cy="-4" r="4" fill="#48d597"/>
      <text x="20" y="0" fill="#b8bec8">STATUS</text>
      <text x="88" y="0" fill="#f1f3f5">BUILDING SYSTEMS THAT FAIL LOUDLY + RECOVER CLEANLY</text>
      <rect class="cursor" x="592" y="-13" width="8" height="17" fill="#ff334f"/>
    </g>

    <g transform="translate(2 195)" fill="#686f7b" font-size="11" letter-spacing="2">
      <text x="0" y="0">LATENCY</text>
      <text x="92" y="0" fill="#c4cad3">MEASURED</text>
      <text x="206" y="0">FAILURES</text>
      <text x="296" y="0" fill="#c4cad3">OBSERVABLE</text>
      <text x="435" y="0">RECOVERY</text>
      <text x="536" y="0" fill="#c4cad3">DETERMINISTIC</text>
    </g>
  </g>

  <g class="signal" fill="#ff334f">
    <rect x="1120" y="48" width="3" height="10" rx="1"/>
    <rect x="1128" y="42" width="3" height="16" rx="1"/>
    <rect x="1136" y="34" width="3" height="24" rx="1"/>
    <rect x="1144" y="26" width="3" height="32" rx="1"/>
  </g>
  <path d="M0 286H1200" stroke="#ff334f" stroke-opacity="0.3"/>
  <text x="73" y="304" fill="#626975" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="2">JUSTNEERAJ12 // POTSDAM, NY // UTC-04</text>
</svg>
